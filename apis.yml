aid: patsnap
name: Patsnap
description: 'Patsnap is an AI-native innovation intelligence platform for patent, R&D and
  life-sciences data, serving more than 18,000 innovators worldwide. Its Eureka Open Platform
  exposes 300+ REST API endpoints (patent search, patent legal and mining data, enterprise and
  drug intelligence, and Eureka AI/LLM capabilities) across 210M+ patents and 2B+ structured data
  points, plus hosted MCP servers, 140+ Agent Skills and embeddable UI widgets. Backed by SoftBank
  Vision Fund and Hongshan (Sequoia China), Patsnap is headquartered in Singapore with offices in
  London, Tokyo, Shanghai and Toronto.'
