        description: API Reference documentation
        url: https://open.patsnap.com/devportal/api-reference/basic-patent-data/simple-legal-status
      parameters:
      - name: patent_id
        in: query
        required: false
        description: patent_id
        schema:
          type: string
          example: 718ead9c-4f3c-4674-8f5a-24e126827269
          description: patent_id
      - name: patent_number
