    P018BasicPatentDataClaimData_Claims:
      type: object
      properties:
        lang:
          type: string
          example: EN
          description: language
        claim_text:
          type: string
          example: '<div class="indep-clm" num="1">1.用于VEGFA基因编辑的系统，包括下述N1）和N2）：</div>

            <div class="indep-clm" num="1">N1）名称为RNA-2的RNA；所述RNA-2为SEQ ID NO.9-12、SEQ ID NO.28和SEQ ID NO.29中至少一条序列所示的RNA；</div>

            <div class="indep-clm" num="1">N2）名称为RNA-1的RNA；所述RNA-1为SEQ ID NO.6所示的RNA。</div>

            <div class="dep-clm" num="2" parent="1"><seg-con>2.根据权利要求1所述的系统，</seg-con><seg-trans>其特征在于：</seg-trans><seg-comp>所述系统还包括Cas9核酸酶或与Cas9核酸酶相关的生物材料；</seg-comp></div>

            <div class="dep-clm" num="2" parent="1"><seg-comp>所述与Cas9核酸酶相关的生物材料为下述C1）至C7）中的任一种：</seg-comp></div>

            <div class="dep-clm" num="2" parent="1"><seg-comp>C1）编码Cas9核酸酶的核酸分子；</seg-comp></div>

            <div class="dep-clm" num="2" parent="1"><seg-comp>C2）含有C1）所述核酸分子的表达盒；</seg-comp></div>

            <div class="dep-clm" num="2" parent="1"><seg-comp>C3）含有C1）所述核酸分子的重组载体、或含有C2）所述表达盒的重组载体；</seg-comp></div>

            <div class="dep-clm" num="2" parent="1"><seg-comp>C4）含有C1）所述核酸分子的重组微生物、或含有C2）所述表达盒的重组微生物、或含有C3）所述重组载体的重组微生物；</seg-comp></div>

            <div class="dep-clm" num="2" parent="1"><seg-comp>C5）含有C1）所述核酸分子的细胞系、或含有C2）所述表达盒的细胞系。</seg-comp></div>

            <div class="dep-clm" num="3" parent="2"><seg-con>3.根据权利要求2所述的系统，</seg-con><seg-trans>其特征在于：</seg-trans><seg-refi>所述Cas9核酸酶来源于细菌。</seg-refi></div>

            <div class="dep-clm" num="4" parent="2"><seg-con>4.根据权利要求2所述的系统，</seg-con><seg-trans>其特征在于：</seg-trans><seg-refi>所述Cas9核酸酶来源于链球菌属、葡萄球菌属、罗氏菌属、奈瑟菌属、细小棒菌属或乳杆菌属。</seg-refi></div>

            <div class="indep-clm" num="5"><seg-con>5.编辑VEGFA基因的方法，</seg-con><seg-trans>包括：</seg-trans><seg-refi>利用权利要求1-4中任一所述系统处理VEGFA基因实现所述VEGFA基因的编辑。</seg-refi></div>

            '
          description: text
        data_format:
          type: string
          example: original
          description: 'Original data: if there are several languages with original data, all will be returned'
        claim_independent_count:
          type: integer
          format: int32
          example: 3
